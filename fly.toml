# Saltwake hosted demo on Fly.io (needs Andrew's approval to create the app: `fly launch --no-deploy --copy-config`).
app = "saltwake"
primary_region = "ord"

[env]
  SALTWAKE_PUBLIC_ORIGIN = "https://saltwake.fly.dev"
  SALTWAKE_CROWD = "0"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "40s"
    method = "GET"
    path = "/api/config"
    [http_service.checks.headers]
      Host = "saltwake.fly.dev"

[mounts]
  source = "saltwake_state"
  destination = "/app/.state"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
